<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src file: data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>Ace Tracker</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f7f8;
        --fg: #141414;
        --muted: #6b6b6b;
        --ring: rgba(20, 20, 20, 0.12);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141414;
          --fg: #f7f7f8;
          --muted: #a3a3a3;
          --ring: rgba(255, 255, 255, 0.12);
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family:
          'Segoe UI',
          system-ui,
          -apple-system,
          sans-serif;
        background: var(--bg);
        color: var(--fg);
        user-select: none;
        -webkit-app-region: drag;
      }
      .wrap {
        display: flex;
        height: 100%;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        padding: 2.5rem;
        text-align: center;
      }
      .icon {
        width: 120px;
        height: 120px;
        border-radius: 28px;
        object-fit: cover;
        box-shadow: 0 0 0 1px var(--ring);
        background: #000;
      }
      .brand {
        font-size: 1.625rem;
        font-weight: 650;
        letter-spacing: -0.02em;
      }
      .status {
        min-height: 1.35rem;
        font-size: 0.9375rem;
        color: var(--muted);
      }
      .spinner {
        width: 28px;
        height: 28px;
        border: 2.5px solid var(--ring);
        border-top-color: var(--fg);
        border-radius: 999px;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <img id="icon" class="icon" alt="" />
      <div class="brand">Ace Tracker</div>
      <div class="spinner" aria-hidden="true"></div>
      <div id="status" class="status">App wird gestartet…</div>
    </div>
    <script>
      window.setSplash = function setSplash(payload) {
        if (payload && payload.icon) {
          var img = document.getElementById('icon')
          img.src = payload.icon
        }
        if (payload && typeof payload.status === 'string') {
          document.getElementById('status').textContent = payload.status
        }
      }
    </script>
  </body>
</html>
