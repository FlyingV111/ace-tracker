appId: com.acetracker.app
productName: Ace Tracker
copyright: Copyright (c) Ace Tracker
directories:
  buildResources: build
  output: release
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,tsconfig.app.json}'
  - '!vite.config.ts'
asarUnpack:
  - resources/**
extraResources:
  - from: resources/
    to: .
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: build/icon.ico
  executableName: Ace Tracker
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Ace Tracker
  uninstallDisplayName: Ace Tracker
  deleteAppDataOnUninstall: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  artifactName: ${productName}-${version}-Setup.${ext}
portable:
  artifactName: ${productName}-${version}-Portable.${ext}
mac:
  target:
    - dmg
    - zip
  category: public.app-category.utilities
  icon: build/icon.png
  artifactName: ${productName}-${version}-mac.${ext}
linux:
  target:
    - AppImage
    - deb
  category: Utility
  icon: build/icon.png
  artifactName: ${productName}-${version}-linux.${ext}
publish:
  provider: github
  releaseType: release
npmRebuild: false
